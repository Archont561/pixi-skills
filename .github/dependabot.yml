# Layout copied from Archont561/pixi-sandbox@7a2dcb1 (.github/dependabot.yml),
# reduced to the ecosystems this repository actually has today.
#
# GitHub Actions is live now: ci.yml and publish-sandbox.yml pin every action to
# a full commit SHA with a trailing `# vX.Y.Z` comment, which is exactly the
# form Dependabot updates in place. Cargo joined it when the Phase 0 workspace
# landed. The npm entry stays commented out until apps/pixi-skills-docs exists —
# enabling an ecosystem whose manifest is absent only produces a permanent
# "Dependabot can't access your manifest" error in the UI, which is why the old
# pip entry (for the knowledge-bundle validator, since removed) is gone too.

version: 2
updates:
  # GitHub Actions (pinned to full SHA with a trailing # vX.Y.Z comment)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
      include: scope
    # Group patch/minor updates to reduce PR noise; major stays separate for review
    groups:
      actions-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Rust dependencies (Cargo.toml workspace). Enabled with Phase 0: the workspace
  # manifests it reads now exist.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: scope
    groups:
      cargo-patch:
        patterns:
          - "*"
        update-types:
          - patch
          - minor

  # Docs site (Astro + Starlight) — enable when apps/pixi-skills-docs exists.
  # Upstream tracks /docs with the npm ecosystem reading package.json + bun.lock.
  # - package-ecosystem: npm
  #   directory: "/apps/pixi-skills-docs"
  #   schedule:
  #     interval: weekly
  #     day: monday
  #     time: "08:00"
  #   open-pull-requests-limit: 5
  #   labels:
  #     - dependencies
  #     - docs
  #   commit-message:
  #     prefix: "chore"
  #     include: scope
  #   groups:
  #     docs-patch:
  #       patterns:
  #         - "*"
  #       update-types:
  #         - patch
  #         - minor
