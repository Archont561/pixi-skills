name: ci

# Every step in this file is ONE line: `pixi run -e <env> <task>`.
#
# Layout copied from Archont561/pixi-sandbox (.github/workflows/ci.yml) and adapted:
#   - the `probe` + `knowledge` jobs are gone: this workflow merges with the
#     workspace already present (pixi.toml + pixi.lock + Cargo.toml), and the OKF
#     Python validator was removed from this repository
#   - `lint-sandbox-plan` is omitted: its task is inert here (no local `pixi-sandbox`
#     command) and sandbox publishing runs through the upstream release binary
#   - `docs-build` runs only once apps/pixi-skills-docs/package.json exists
#
# The upstream rule is kept verbatim: every workspace step is ONE line,
# `pixi run -e <env> <task>`. A step that needs more than one line belongs in
# pixi.toml as a task — never inline bash here. That keeps this file reviewable
# and means the command CI runs is the command a contributor runs locally.
#
# Action pins are full commit SHAs with a trailing `# vX.Y.Z` comment, taken
# from pixi-sandbox. Dependabot maintains them (.github/dependabot.yml).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

jobs:
  ci:
    name: ci (lint · test · coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          environments: dev
          cache: true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: pixi run -e dev fmt-check
      - run: pixi run -e dev lint-rust
      - run: pixi run -e dev deny
      - run: pixi run -e dev lint-actions
      - run: pixi run -e dev lint-toml
      - run: pixi run -e dev lint-docs
      - run: pixi run -e dev test
      - run: pixi run -e dev test-doc
      - run: pixi run -e dev coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - if: hashFiles('apps/pixi-skills-docs/package.json') != ''
        run: pixi run -e dev docs-build
      - if: hashFiles('apps/pixi-skills-docs/package.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: apps/pixi-skills-docs/dist
          retention-days: 7