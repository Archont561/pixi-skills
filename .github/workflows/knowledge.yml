name: Knowledge bundle

on:
  pull_request:
    paths:
      - '.knowledge/**'
      - 'scripts/check_knowledge.py'
      - 'tests/test_knowledge.py'
      - 'requirements-knowledge.txt'
      - '.github/workflows/knowledge.yml'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - '.knowledge/**'
      - 'scripts/check_knowledge.py'
      - 'tests/test_knowledge.py'
      - 'requirements-knowledge.txt'
      - '.github/workflows/knowledge.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: OKF structure and repository lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-knowledge.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-knowledge.txt
      - name: Test the validator
        run: python -m unittest discover -s tests -v
      - name: Check OKF structure and authoring policy
        run: python scripts/check_knowledge.py --lint
