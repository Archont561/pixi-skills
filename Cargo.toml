[workspace]
resolver = "2"
members = [
  "crates/skills-core",
  "crates/skills-provider-github",
  "crates/skills-provider-conda",
  "crates/skills-provider-prefix",
  "crates/skills-provider-pypi",
  "crates/pixi-skills",
  "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Archont561/pixi-skills"
authors = ["Archont561"]

# Shared dependency table, mirroring the Archont561/pixi-sandbox workspace layout.
# Dependencies for the rattler-based conda provider are added in Phase 3
# (see .knowledge/crates/skills-provider-conda.md), not here yet.
[workspace.dependencies]
# library + CLI
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
semver = "1"
directories = "5"
which = "7"
# async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
# HTTP (providers)
reqwest = { version = "0.12", features = [
  "json",
  "rustls-tls",
], default-features = false }
# files, hashes, archives, codegen
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
glob = "0.3"
walkdir = "2"
xshell = "0.2"
toml_edit = "0.22"
schemars = "0.8"
# CLI UX
console = "0.16"
indicatif = "0.17"
tabled = "0.18"
dialoguer = "0.11"
# dev
assert_cmd = "2"
predicates = "3"
proptest = "1"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
opt-level = "z"

# Lint set per .knowledge/tooling/rustfmt-clippy.md, adopted with the Phase 0 leftovers.
# Every crate inherits it via `[lints] workspace = true`; individual crates may only
# relax, never tighten (the CLI crates below allow the print lints, which is their
# raison d'être). `unsafe_code` stays `forbid` (stronger than the doc's `deny`).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_imports = "deny"
dead_code = "warn"

[workspace.lints.clippy]
# ── Deny: bugs or serious code smells ─────────────────────────────
unwrap_used = "deny"
panic = "deny"
dbg_macro = "deny"
# ── Warn: context-dependent, CI fails because of `-D warnings` ────
expect_used = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
# ── Warn: style and idiom suggestions ─────────────────────────────
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
cloned_instead_of_copied = "warn"
flat_map_option = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
trivially_copy_pass_by_ref = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"
# ── Allow: explicitly permitted ───────────────────────────────────
module_name_repetitions = "allow"
too_many_arguments = "allow"
# clippy-owned (moved from rustc in recent toolchains — a rustc table entry
# triggers `renamed_and_removed_lints`).
missing_errors_doc = "allow"
