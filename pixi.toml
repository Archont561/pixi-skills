[workspace]
name = "pixi-skills"
version = "0.1.0"
description = "Provider-agnostic, reproducible skills manager for AI coding agents"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

# ---------------------------------------------------------------------------
# Features are layered so each environment only installs what it needs.
# Dependency set, feature layout and pinning style copied verbatim from
# Archont561/pixi-sandbox (pixi.toml) and adapted only where the two projects
# differ (crate names, docs app path, package task).
# ---------------------------------------------------------------------------

[feature.rust.dependencies]
rust = "1.98.*"
cargo-nextest = "*"
cargo-llvm-cov = "*"
cargo-deny = "*"

[feature.docs.dependencies]
biome = "*"
nodejs = "*" # Astro still shells out to node in places

# `bun` has no win-64 build on conda-forge (verified with `pixi lock`: "No candidates
# were found for bun *"). The docs site is built on Linux in CI and on macOS by hand, so
# the dependency is scoped instead of dropping win-64 from the whole workspace.
[feature.docs.target.linux-64.dependencies]
bun = "*"

[feature.docs.target.osx-arm64.dependencies]
bun = "*"

[feature.utils.dependencies]
actionlint = "*"
lefthook = "*"
taplo = "*"
convco = "*"

[feature.sandbox.dependencies]
# The pixi-packing toolchain behind the airlock workflow. CI itself does not depend on
# this feature locally: .github/workflows/publish-sandbox.yml consumes the upstream
# release binary (release-binary mode), not a local crate.
pixi-pack = "*"
pixi-unpack = "*"
rattler-index = "*"

[environments]
default = ["rust"]
dev = { features = ["rust", "utils", "docs", "sandbox"], solve-group = "dev" }
# `ci` deliberately excludes `utils` and `docs`: a CI runner needs cargo + the sandbox
# tools, not git hooks or the docs toolchain.
ci = { features = ["rust", "sandbox"], solve-group = "ci" }
# `bun` has no win-64 build on conda-forge, and the docs site is only ever built on
# Linux (CI) or a developer's mac; the *Rust* workspace still targets all three platforms.
docs = { features = ["docs"], solve-group = "docs" }

# ---------------------------------------------------------------------------
# Tasks. Everything a human, a git hook or a CI job does is one of these, so a
# GitHub Actions step can be a single line: `pixi run -e <env> <task>`. Logic
# lives here (reviewable, runnable locally), not in workflow YAML.
#
# `*-ci` variants read their paths from the environment (the workflow sets them)
# because pixi tasks have no `${VAR:-default}` — plain `$VAR` expands, but a
# missing value expands to an empty string, so those tasks are for callers that
# always set the variables.
#
# The `sandbox-*` / `ci-*` / `lint-sandbox-plan` tasks below are kept verbatim
# from upstream even though this repository has no local `pixi-sandbox` crate:
# they are inert here until that crate (or an equivalent binary on $PATH) exists,
# and `lint-sandbox-plan` is therefore excluded from the `lint` composite.
# Sandbox publishing for this repo runs through the upstream release binary via
# .github/workflows/publish-sandbox.yml instead.
# ---------------------------------------------------------------------------

[tasks]
# rust
build = "cargo build --workspace"
test = "cargo nextest run --workspace"
test-doc = "cargo test --workspace --doc"
coverage = "cargo llvm-cov nextest --workspace --lcov --output-path lcov.info"
lint-rust = "cargo clippy --workspace --all-targets -- -D warnings"
fmt = "cargo fmt --all"
fmt-check = "cargo fmt --all --check"
deny = "cargo deny check"

# config / workflows / docs
lint-actions = "actionlint"
# Inert until a local `pixi-sandbox` command exists; kept for upstream parity.
lint-sandbox-plan = "pixi-sandbox plan --config .pixi-sandbox.toml --json"
lint-toml = "taplo fmt --check pixi.toml .pixi-sandbox.toml Cargo.toml crates/skills-core/Cargo.toml crates/skills-provider-github/Cargo.toml crates/skills-provider-conda/Cargo.toml crates/skills-provider-prefix/Cargo.toml crates/skills-provider-pypi/Cargo.toml crates/pixi-skills/Cargo.toml xtask/Cargo.toml deny.toml"
lint-docs = "biome check apps/pixi-skills-docs"
# conventional-commit check for the `commit-msg` hook; reads the proposed message from stdin
lint-commit = "convco check --from-stdin"
# changelog via convco (conventional commits -> CHANGELOG.md)
changelog = "convco changelog > CHANGELOG.md"
changelog-preview = "convco changelog"
# one line for the whole lint gate (needs the `dev` environment: rust + utils + docs)
lint = { depends-on = [
  "fmt-check",
  "lint-rust",
  "deny",
  "lint-actions",
  "lint-toml",
  "lint-docs",
] }

# docs
docs-install = { cmd = "bun install --frozen-lockfile", cwd = "apps/pixi-skills-docs" }
docs-dev = { cmd = "bun run dev", cwd = "apps/pixi-skills-docs" }
docs-build = { depends-on = [
  "docs-install",
], cmd = "bun run build", cwd = "apps/pixi-skills-docs" }

# the conda package this project ships, installed with
# `pixi global install -c <target-dir> -c conda-forge pixi-skills` (decision D8)
package = "pixi publish --path crates/pixi-skills --build-dir .publish/build --target-dir .publish/out"

# ---------------------------------------------------------------------------
# The transport pipeline, locally: pack → doctor → publish. These tasks mirror the
# upstream command surface for parity but require a `pixi-sandbox` command (crate or
# binary) that does not exist in this repository yet; publishing here uses the upstream
# release binary via .github/workflows/publish-sandbox.yml.
# ---------------------------------------------------------------------------
sandbox-plan = "pixi-sandbox plan --config .pixi-sandbox.toml"
sandbox-pack = "pixi-sandbox pack --repo-root . --envs dev --output-dir .sandbox-out --platform linux-64 --cargo-vendor --fetch-tools --self-bin target/release/pixi-sandbox"
sandbox-doctor = "pixi-sandbox doctor --branch-location .sandbox-out --verify"
sandbox-publish = "pixi-sandbox publish --input-dir .sandbox-out --branch-name sandbox/dev-linux-64 --remote origin"
# One-liner offline reconstruction from orphan branch, with PATH aliases wired
# like setup-pixi.
sandbox-restore = "bash scripts/restore.sh"